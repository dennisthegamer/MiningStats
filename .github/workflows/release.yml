# Build all three Minecraft version branches and create a single GitHub release
# with all JAR files. Triggered manually or on version tag push.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.branch }}
    strategy:
      matrix:
        include:
          - branch: mc26.2
            java-version: '25'
            mc-label: 'mc26.2'
          - branch: mc26.1
            java-version: '25'
            mc-label: 'mc26.1'
          - branch: mc1.21.9-1.21.11
            java-version: '21'
            mc-label: 'mc1.21.9-1.21.11'
          - branch: mc1.21-1.21.8
            java-version: '21'
            mc-label: 'mc1.21-1.21.8'
          - branch: mc1.21.5
            java-version: '21'
            mc-label: 'mc1.21.5'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Extract version information
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mc-label }}
          path: |
            fabric/build/libs/
            neoforge/build/libs/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: mc26.1
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Collect all JARs
        run: |
          mkdir -p release-jars
          find artifacts/ -name "*.jar" -exec cp {} release-jars/ \;
          echo "Release JARs:"
          ls -la release-jars/

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[.*\]/{flag=0} flag" CHANGELOG.md | sed '/^$/d')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changelog entry available for this version."
          fi

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate release body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_body.md << EOF
          ## What's New in v${VERSION}

          ${{ steps.changelog.outputs.changelog }}

          ## Downloads

          | Minecraft Version | File |
          |---|---|
          | 26.1 | \`miningstats-mc26.1-${VERSION}.jar\` |
          | 1.21.9 - 1.21.11 | \`miningstats-mc1.21.11-${VERSION}.jar\` |
          | 1.21 - 1.21.8 | \`miningstats-mc1.21.8-${VERSION}.jar\` |

          ## Requirements

          - **Fabric Loader:** 0.18.3+
          - **Fabric API:** Required
          - **Java:** 21+ (Java 25+ for MC 26.1)
          - **Optional:** Cloth Config, Mod Menu

          ---

          **Installation:** Download the JAR matching your Minecraft version and place it in your \`mods\` folder along with Fabric API.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MiningStats v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: release-jars/*.jar
          draft: false
          prerelease: false
