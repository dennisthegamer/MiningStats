plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Modrinth Maven for ModMenu
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// Shedaniel's Maven for Cloth Config
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.1 is unobfuscated - no mappings needed with fabric-loom plugin
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config API - not yet available for MC 26.1 (unobfuscated)
	// compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
	// 	exclude(group: "net.fabricmc.fabric-api")
	// }
	// localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
	// 	exclude(group: "net.fabricmc.fabric-api")
	// }

	// ModMenu
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
