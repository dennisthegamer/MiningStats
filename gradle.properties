# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Compatible with Minecraft 1.21 through 1.21.8
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.18.3
loom_version=1.14-SNAPSHOT

# Fabric API
fabric_version=0.136.1+1.21.8

# Mod Properties
mod_version=1.1.0
maven_group=com.miningstats
archives_base_name=miningstats

# YACL - Yet Another Config Lib (config screen; users install separately).
# Compile-only; 3.8.2+1.21.6 matches the runtime jar in the 1.21.6-1.21.8 instances.
yacl_version=3.8.2+1.21.6-fabric

# ModMenu (dev only) - 15.x line for 1.21.6-1.21.8
modmenu_version=15.0.0
