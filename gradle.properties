# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Built against Minecraft 1.21.5 (Yarn). The 1.21.6 GUI rework changed the
# GuiGraphics.drawString(...) ABI (int->void), so 1.21.5 needs its own build.
minecraft_version=1.21.5
# Supported MC range (used for the jar name: <mod>-fabric-<version>+mc<range>.jar)
minecraft_range=1.21-1.21.5
yarn_mappings=1.21.5+build.1
loader_version=0.16.14
loom_version=1.14-SNAPSHOT

# Fabric API
fabric_version=0.128.2+1.21.5

# Mod Properties
mod_version=1.1.0
maven_group=com.miningstats
archives_base_name=miningstats

# YACL - Yet Another Config Lib (config screen; users install separately).
# Compile-only, so building against 3.8.2+1.21.5 matches the runtime jar in the instance.
yacl_version=3.8.2+1.21.5-fabric

# ModMenu (dev only) - 14.0.2 is the 1.21.5-compatible line
modmenu_version=14.0.2
